# Ретранслятор на своём сервере: Redis и два порта.
# 18082 принимает утверждённую заявку, 8554 — сессия клиента и оператора.
# RELAY_INGEST_TOKEN должен совпадать с сервисом заявок.
#
#   docker compose -f relay-service/docker-compose.yaml up -d --build

name: support-relay

services:
  redis:
    image: redis:7
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 20

  relay:
    build: .
    restart: unless-stopped
    ports:
      - "${RELAY_INGEST_BIND:-127.0.0.1}:18082:18082"
      - "8554:8554"
    volumes:
      - "${RELAY_TLS_DIR:?Set RELAY_TLS_DIR}:/run/relay-tls:ro"
    environment:
      INGEST_ADDR: 0.0.0.0:18082
      SESSION_ADDR: :8554
      SESSION_TLS_CERT: /run/relay-tls/fullchain.pem
      SESSION_TLS_KEY: /run/relay-tls/privkey.pem
      RTSP_ADDR: 127.0.0.1:18554
      REDIS_ADDR: redis:6379
      RELAY_INGEST_TOKEN: ${RELAY_INGEST_TOKEN:?Set RELAY_INGEST_TOKEN}
    depends_on:
      redis:
        condition: service_healthy
