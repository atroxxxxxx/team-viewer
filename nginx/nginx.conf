worker_processes 1;
error_log /dev/stderr warn;
pid /tmp/nginx.pid;

events {
    worker_connections 128;
}

http {
    access_log /dev/stdout;

    # Оба файла пишет контейнер certs до старта nginx.
    # http.conf: прокси по HTTP, если HTTPS нет, иначе только редирект на HTTPS.
    # tls.conf: серверы 443 либо комментарий, если сертификата нет.
    include /etc/letsencrypt/http.conf;
    include /etc/letsencrypt/tls.conf;
}
