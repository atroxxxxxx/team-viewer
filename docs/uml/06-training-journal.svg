ns" font-size="13" lengthAdjust="spacingAndGlyphs" textLength="146" x="831" y="433.9966">Размеченный эпизод:</text><text fill="#000000" font-family="DejaVu Sans" font-size="13" lengthAdjust="spacingAndGlyphs" textLength="227" x="831" y="449.1294">проблема, план, действия, исход</text><line style="stroke: #A80036; stroke-width: 1.0; stroke-dasharray: 2.0,2.0;" x1="1075" x2="1117" y1="483.3281" y2="483.3281"/><line style="stroke: #A80036; stroke-width: 1.0; stroke-dasharray: 2.0,2.0;" x1="1117" x2="1117" y1="483.3281" y2="496.3281"/><line style="stroke: #A80036; stroke-width: 1.0; stroke-dasharray: 2.0,2.0;" x1="1076" x2="1117" y1="496.3281" y2="496.3281"/><polygon fill="#A80036" points="1086,492.3281,1076,496.3281,1086,500.3281,1082,496.3281" style="stroke: #A80036; stroke-width: 1.0;"/><text fill="#000000" font-family="DejaVu Sans" font-size="13" font-weight="bold" lengthAdjust="spacingAndGlyphs" textLength="9" x="1082" y="478.2622">5</text><text fill="#000000" font-family="DejaVu Sans" font-size="13" lengthAdjust="spacingAndGlyphs" textLength="250" x="1095" y="478.2622">Обучение своей модели на эпизодах</text><!--MD5=[8876942d07da3a62339c93d21643475b]
@startuml 06-training-journal
title 06. Журнал и будущее обучение модели\nСПЕЦПОМЕТКА: пунктир не входит в поставку
skinparam defaultFontName DejaVu Sans
skinparam sequenceMessageAlign left
autonumber

participant "Сервис заявок" as Tickets
database "PostgreSQL" as DB
collections "Журнал действий" as Log
participant "Корпус обучения" as Corpus
participant "Обучение своей модели" as Trainer

Tickets -> DB : INSERT action_log\nна каждый шаг сессии
note over Tickets, DB
  Пишется всегда: заявка, план, наблюдение,
  команда, отказ политики, отказ валидатора,
  подтверждение.
  detail события ввода хранит текст поля.
  Кадр экрана в строку не кладётся.
end note
DB -> Log : Строка журнала доступна\nсервису заявок

note over Corpus, Trainer
  СПЕЦПОМЕТКА.
  Контур обучения не входит в поставку.
  Ниже только целевой будущий поток.
end note

Log - -> Corpus : Выгрузка обезличенного эпизода заявки
Corpus - -> Trainer : Размеченный эпизод:\nпроблема, план, действия, исход
Trainer - -> Trainer : Обучение своей модели на эпизодах
@enduml

